<!DOCTYPE html>
<html>
<head>
    <title>Connect Four</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2C3E50;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .game-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #E74C3C;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #F8F9FA;
            border-radius: 10px;
            border: 2px solid #E9ECEF;
        }
        
        .current-player {
            font-size: 20px;
            font-weight: bold;
        }
        
        .player-red { color: #E74C3C; }
        .player-yellow { color: #F39C12; }
        
        .score {
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: bold;
        }
        
        .board {
            display: inline-block;
            background: #3498DB;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(7, 60px);
            grid-template-rows: repeat(6, 60px);
            gap: 8px;
        }
        
        .cell {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .cell:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .cell.red {
            background: linear-gradient(135deg, #E74C3C, #C0392B);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .cell.yellow {
            background: linear-gradient(135deg, #F39C12, #E67E22);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .cell.winning {
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #3498DB;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2980B9;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #95A5A6;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #7F8C8D;
            transform: translateY(-2px);
        }
        
        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 1000;
        }
        
        .game-over h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        
        .column-indicator {
            display: grid;
            grid-template-columns: repeat(7, 60px);
            gap: 8px;
            margin-bottom: 10px;
            padding: 0 20px;
        }
        
        .column-hover {
            height: 20px;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .column-hover.active {
            opacity: 0.7;
        }
        
        .column-hover.red { background: #E74C3C; }
        .column-hover.yellow { background: #F39C12; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">🔴 CONNECT FOUR 🟡</h1>
        
        <div class="game-info">
            <div class="current-player">
                Current Player: <span id="currentPlayer" class="player-red">Red</span>
            </div>
            <div class="score">
                <div>Red: <span id="redScore">0</span></div>
                <div>Yellow: <span id="yellowScore">0</span></div>
            </div>
        </div>
        
        <div class="board">
            <div class="column-indicator" id="columnIndicator"></div>
            <div class="grid" id="gameGrid"></div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="game.newGame()">New Game</button>
            <button class="btn btn-secondary" onclick="game.toggleAI()">Toggle AI</button>
            <button class="btn btn-secondary" onclick="game.resetScore()">Reset Score</button>
        </div>
    </div>
    
    <div class="game-over" id="gameOver">
        <h2 id="gameResult">Game Over</h2>
        <p id="gameMessage">Congratulations!</p>
        <button class="btn btn-primary" onclick="game.newGame(); document.getElementById('gameOver').style.display='none';">Play Again</button>
    </div>
    
    <script src="connect4.js"></script>
</body>
</html>
