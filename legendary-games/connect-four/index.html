<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Four | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
<style>
.c4 { width: min(100%, 78vh, 600px); }
.column-indicator, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2.2%; padding: 0 3%; }
.column-indicator { margin-bottom: 8px; }
.column-hover { aspect-ratio: 1; border-radius: 50%; opacity: 0; cursor: pointer; transform: scale(.82); }
.column-hover.active { opacity: 1; }
.grid { background: #2F6FDB; padding: 3%; border-radius: 16px; box-shadow: inset 0 3px 0 rgba(255, 255, 255, .3), inset 0 -6px 0 rgba(0, 0, 0, .2); }
.cell { aspect-ratio: 1; border-radius: 50%; background: var(--screen); cursor: pointer; box-shadow: inset 0 4px 0 rgba(0, 0, 0, .45); }
.red { background: #F0554B; }
.yellow { background: #FFC629; }
.cell.red, .cell.yellow { box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .2), inset 0 3px 0 rgba(255, 255, 255, .35); animation: drop .28s cubic-bezier(.3, 1.3, .6, 1); }
.cell.winning { outline: 4px solid #fff; outline-offset: -4px; animation: none; }
@keyframes drop { from { transform: translateY(-140%); } }
.player-red::before, .player-yellow::before { content: ''; display: inline-block; width: .62em; height: .62em; border-radius: 50%; margin-right: 8px; background: #D8362C; }
.player-yellow::before { background: #E3A900; box-shadow: inset 0 0 0 2px var(--lcd-ink); }
</style>
</head>
<body data-game="connect4">

<main class="console console--narrow">
  <div class="lcd">
    <div class="read"><span class="read__label">Turn</span><span class="read__value"><span id="currentPlayer" class="player-red">Red</span></span></div>
    <div class="read lcd__push"><span class="read__label">Red wins</span><span class="read__value" id="redScore">0</span></div>
    <div class="read "><span class="read__label">Yellow wins</span><span class="read__value" id="yellowScore">0</span></div>
  </div>
  <div class="screen">
    <div class="c4">
      <div class="column-indicator" id="columnIndicator"></div>
      <div class="grid" id="gameGrid" aria-label="Connect Four board"></div>
    </div>
    <div class="overlay" id="gameOver">
      <div class="overlay__in">
        <h2 id="gameResult">Game over</h2>
        <p id="gameMessage"></p>
        <div class="btns"><button class="btn" type="button" onclick="game.newGame(); document.getElementById('gameOver').style.display='none';">Play again</button></div>
      </div>
    </div>
  </div>
  <div class="btns btns--wrap">
    <button class="btn btn--primary" type="button" onclick="game.newGame()">New game</button>
    <button class="btn" type="button" aria-pressed="false" onclick="game.toggleAI(); this.setAttribute('aria-pressed', game.aiEnabled)">Play against the computer</button>
    <button class="btn btn--danger" type="button" onclick="game.resetScore()">Reset score</button>
  </div>
</main>

<template id="howto">
<ul>
  <li>Take turns dropping a disc into any column. It falls to the lowest free slot.</li>
  <li>First to line up four of their colour wins: across, down or diagonally.</li>
  <li>Play a friend on the same screen, or switch on the computer to play Yellow.</li>
</ul>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="connect4.js"></script>
</body>
</html>
