<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Townscaper | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
<style>
.screen { padding: 0; }
.screen canvas { width: 100%; height: min(68vh, 640px); max-height: none; border-radius: var(--r-m); cursor: pointer; }
.color-palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.color-btn { appearance: none; border: 0; aspect-ratio: 1; border-radius: 10px; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .18); }
.color-btn.active { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body data-game="townscaper">

<main class="console">
  <div class="deck">
    <div class="screen"><canvas id="gameCanvas" aria-label="Town canvas"></canvas></div>
    <aside class="panel">
      <div class="plate"><h2>Block colour</h2>
        <div class="color-palette">
          <button type="button" class="color-btn active" data-color="#ff6b6b" style="background:#ff6b6b" aria-label="Coral"></button>
          <button type="button" class="color-btn" data-color="#4ecdc4" style="background:#4ecdc4" aria-label="Turquoise"></button>
          <button type="button" class="color-btn" data-color="#45b7d1" style="background:#45b7d1" aria-label="Sky blue"></button>
          <button type="button" class="color-btn" data-color="#96ceb4" style="background:#96ceb4" aria-label="Sage"></button>
          <button type="button" class="color-btn" data-color="#feca57" style="background:#feca57" aria-label="Yellow"></button>
          <button type="button" class="color-btn" data-color="#ff9ff3" style="background:#ff9ff3" aria-label="Pink"></button>
          <button type="button" class="color-btn" data-color="#54a0ff" style="background:#54a0ff" aria-label="Blue"></button>
          <button type="button" class="color-btn" data-color="#5f27cd" style="background:#5f27cd" aria-label="Purple"></button>
        </div>
      </div>
      <div class="btns btns--row">
        <button type="button" id="buildMode" class="btn tool-btn active">Build</button>
        <button type="button" id="deleteMode" class="btn tool-btn">Delete</button>
      </div>
      <button type="button" id="clearAll" class="btn btn--danger">Clear the town</button>
      <div class="plate">
        <p><b>Click</b> to place or remove a block.<br><b>Right-drag</b> to pan.<br><b>Scroll</b> to zoom.</p>
      </div>
    </aside>
  </div>
</main>

<template id="howto">
<ul>
  <li>There is no score and no way to lose. Pick a colour and click the water to place a block.</li>
  <li>Click an existing block to stack another on top and build upward.</li>
  <li>Switch to Delete to remove blocks one at a time.</li>
  <li>Drag with the right mouse button to move around, and scroll to zoom.</li>
</ul>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="script.js"></script>
</body>
</html>
