<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Impostor | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
<style>
.role-crewmate, .role-impostor { font-weight: 800; font-size: 26px; font-stretch: 85%; text-transform: capitalize; }
.role-impostor { color: #C4222A; }
.player-item, .task-item { display: flex; align-items: center; gap: 10px; justify-content: space-between; font-size: 14px; padding: 5px 0; }
.player-item { justify-content: flex-start; font-weight: 600; }
.player-color { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .35); }
.player-dead { opacity: .4; text-decoration: line-through; }
.task-item span:last-child { font-size: 12px !important; color: var(--ink-2); opacity: 1 !important; }
.task-completed { text-decoration: line-through; opacity: .5; }
.minimap { position: absolute; top: 22px; right: 22px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 2px rgba(255, 255, 255, .25); }
.minimap canvas { display: block; border-radius: 0; }
.vote-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; width: min(460px, 80vw); }
.vote-btn { appearance: none; border: 3px solid #fff; border-radius: 12px; padding: 14px 8px; font: 800 16px var(--display); color: #14161B; cursor: pointer; text-shadow: 0 0 6px #fff, 0 0 2px #fff; }
@media (max-width: 560px) { .minimap { display: none; } }
</style>
</head>
<body data-game="impostor">

<main class="console">
  <div class="deck deck--left">
    <aside class="panel">
      <div class="plate"><h2>Your role</h2><div id="playerRole"><span class="role-crewmate">CREWMATE</span></div></div>
      <div class="plate"><h2>Tasks done <span id="taskProgress">0/5</span></h2><div id="tasksList"></div></div>
      <div class="plate"><h2>Players, <span id="playersAlive">6</span> alive</h2><div id="playersList"></div></div>
    </aside>
    <div class="panel">
      <div class="screen">
        <canvas id="gameCanvas" width="800" height="600" aria-label="Ship map"></canvas>
        <div class="minimap" id="minimap"><canvas id="minimapCanvas" width="146" height="96"></canvas></div>
        <div class="overlay" id="votingPanel">
          <div class="overlay__in">
            <h2>Emergency meeting</h2>
            <p>Who is the impostor?</p>
            <div class="vote-options" id="voteOptions"></div>
            <div class="btns"><button class="btn" type="button" onclick="game.skipVote()">Skip the vote</button></div>
          </div>
        </div>
        <div class="overlay" id="gameOverlay">
          <div class="overlay__in">
            <h2 id="overlayTitle">Game over</h2>
            <p id="overlayMessage"></p>
            <div class="btns"><button class="btn" type="button" onclick="game.newGame(); game.hideOverlay();">Play again</button></div>
          </div>
        </div>
      </div>
      <div class="btns btns--wrap">
        <button class="btn btn--primary" type="button" onclick="game.doTask()">Complete a task</button>
        <button class="btn" type="button" onclick="game.reportBody()">Report a body</button>
        <button class="btn" type="button" onclick="game.callEmergency()">Call a meeting</button>
        <button class="btn btn--danger" type="button" onclick="game.sabotage()" id="sabotageBtn">Sabotage</button>
        <button class="btn btn--danger" type="button" onclick="game.kill()" id="killBtn">Eliminate a player</button>
        <button class="btn" type="button" onclick="game.newGame()">New game</button>
      </div>
    </div>
  </div>
</main>

<template id="howto">
<ul>
  <li>Each game you are secretly dealt a role: crewmate or impostor.</li>
  <li><b>Crewmates</b> win by completing every task, or by voting out the impostor at a meeting.</li>
  <li><b>The impostor</b> wins by eliminating crewmates until they are outnumbered. Sabotage slows the crew down.</li>
  <li>Anyone can report a body or call an emergency meeting. At a meeting everyone votes, and the player with the most votes is ejected.</li>
</ul>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="impostor.js"></script>
</body>
</html>
