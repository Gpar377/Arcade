<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Tetris | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
<style>
.deck { grid-template-columns: minmax(0, 1fr) 200px; }
.next { background: var(--screen); border-radius: 10px; display: grid; place-items: center; padding: 10px; }
@media (max-width: 900px) { .deck { grid-template-columns: minmax(0, 1fr) 132px; } .only-wide { display: none; } }
</style>
</head>
<body data-game="tetris" data-pad="arrows repeat space:Drop p:Pause">

<main class="console console--narrow">
  <div class="lcd">
    <div class="read "><span class="read__label">Score</span><span class="read__value" id="score">0</span></div>
    <div class="read "><span class="read__label">Level</span><span class="read__value" id="level">1</span></div>
    <div class="read "><span class="read__label">Lines</span><span class="read__value" id="lines">0</span></div>
  </div>
  <div class="deck">
    <div class="screen">
      <canvas id="gameCanvas" width="300" height="600" aria-label="Tetris well"></canvas>
      <div class="overlay" id="gameOver">
        <div class="overlay__in">
          <h2>Game over</h2>
          <p>Final score <span id="finalScore">0</span></p>
          <div class="btns"><button class="btn" type="button" onclick="game.restart()">Play again</button></div>
        </div>
      </div>
    </div>
    <aside class="panel">
      <div class="plate"><h2>Next piece</h2><div class="next"><canvas id="nextCanvas" width="80" height="80"></canvas></div></div>
      <div class="plate only-wide"><h2>Points per clear</h2>
        <div class="row"><span>1 line</span><b>100</b></div>
        <div class="row"><span>2 lines</span><b>300</b></div>
        <div class="row"><span>3 lines</span><b>500</b></div>
        <div class="row"><span>4 lines</span><b>800</b></div>
      </div>
    </aside>
  </div>
  <div class="legend">
    <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> move</span>
    <span><kbd>&uarr;</kbd> rotate</span>
    <span><kbd>&darr;</kbd> soft drop</span>
    <span><kbd>Space</kbd> hard drop</span>
    <span><kbd>P</kbd> pause</span>
    <span><kbd>R</kbd> restart</span>
  </div>
</main>

<template id="howto">
<ul>
  <li>Move and rotate the falling piece so rows fill completely. Full rows clear.</li>
  <li>Clearing several rows at once scores more: 100, 300, 500, then 800 for four.</li>
  <li>The game speeds up as your level rises, and ends when the stack reaches the top.</li>
</ul>
<p><kbd>&larr;</kbd><kbd>&rarr;</kbd> move &nbsp; <kbd>&uarr;</kbd> rotate &nbsp; <kbd>&darr;</kbd> soft drop &nbsp; <kbd>Space</kbd> hard drop &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>R</kbd> restart</p>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="tetris.js"></script>
</body>
</html>
