<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Dungeon - Roguelike RPG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #000000, #1a0033, #330066);
            color: #00ff00;
            overflow: hidden;
            height: 100vh;
        }

        .game-container {
            display: grid;
            grid-template-columns: 250px 1fr 250px;
            grid-template-rows: 60px 1fr 150px;
            height: 100vh;
            gap: 2px;
        }

        .header {
            grid-column: 1 / -1;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid #00ff00;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .title {
            font-size: 24px;
            text-shadow: 0 0 10px #00ff00;
        }

        .floor-info {
            font-size: 18px;
            color: #ff00ff;
        }

        .left-panel {
            background: rgba(0, 0, 0, 0.8);
            border-right: 2px solid #00ff00;
            padding: 15px;
            overflow-y: auto;
        }

        .game-area {
            background: #000011;
            position: relative;
            overflow: hidden;
        }

        .right-panel {
            background: rgba(0, 0, 0, 0.8);
            border-left: 2px solid #00ff00;
            padding: 15px;
            overflow-y: auto;
        }

        .bottom-panel {
            grid-column: 1 / -1;
            background: rgba(0, 0, 0, 0.9);
            border-top: 2px solid #00ff00;
            padding: 15px;
            display: flex;
            gap: 20px;
        }

        .dungeon-grid {
            display: grid;
            grid-template-columns: repeat(20, 25px);
            grid-template-rows: repeat(15, 25px);
            gap: 1px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .cell {
            width: 25px;
            height: 25px;
            border: 1px solid rgba(0, 255, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            position: relative;
        }

        .wall { background: #333; border-color: #666; }
        .floor { background: #001100; }
        .player { background: #00ff00; color: #000; }
        .enemy { background: #ff0000; color: #fff; }
        .treasure { background: #ffff00; color: #000; }
        .stairs { background: #00ffff; color: #000; }
        .shop { background: #ff00ff; color: #fff; }

        .stat-section {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #00ff00;
            border-radius: 5px;
            background: rgba(0, 255, 0, 0.1);
        }

        .stat-bar {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ff00;
            height: 15px;
            border-radius: 8px;
            overflow: hidden;
            margin: 3px 0;
        }

        .stat-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .hp-fill { background: linear-gradient(90deg, #ff0000, #ff6666); }
        .energy-fill { background: linear-gradient(90deg, #0066ff, #66aaff); }
        .xp-fill { background: linear-gradient(90deg, #00ff00, #66ff66); }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            margin: 10px 0;
        }

        .inv-slot {
            aspect-ratio: 1;
            border: 1px solid #00ff00;
            background: rgba(0, 255, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .inv-slot:hover {
            background: rgba(0, 255, 0, 0.3);
            box-shadow: 0 0 5px #00ff00;
        }

        .inv-slot.occupied {
            background: rgba(255, 255, 0, 0.2);
            border-color: #ffff00;
        }

        .equipment-slot {
            width: 40px;
            height: 40px;
            border: 2px solid #00ff00;
            background: rgba(0, 255, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .equipment-slot:hover {
            background: rgba(0, 255, 0, 0.3);
        }

        .equipment-slot.equipped {
            background: rgba(255, 255, 0, 0.3);
            border-color: #ffff00;
        }

        .action-btn {
            padding: 8px 16px;
            background: linear-gradient(45deg, #00ff00, #00aa00);
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 2px;
        }

        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0, 255, 0, 0.5);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .combat-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .enemy-display {
            width: 150px;
            height: 150px;
            border: 3px solid #ff0000;
            border-radius: 15px;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.3), rgba(255, 0, 0, 0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 18px;
            animation: enemyGlow 2s infinite alternate;
        }

        @keyframes enemyGlow {
            0% { box-shadow: 0 0 10px #ff0000; }
            100% { box-shadow: 0 0 30px #ff0000; }
        }

        .combat-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .log-area {
            flex: 1;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 10px;
            overflow-y: auto;
            font-size: 12px;
            max-height: 120px;
        }

        .minimap {
            width: 100px;
            height: 75px;
            border: 1px solid #00ff00;
            background: rgba(0, 0, 0, 0.8);
            margin-top: 10px;
        }

        .section-title {
            color: #ffff00;
            font-size: 14px;
            margin-bottom: 8px;
            text-shadow: 0 0 5px #ffff00;
        }

        .skill-tree {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin: 10px 0;
        }

        .skill-node {
            padding: 5px;
            border: 1px solid #00ff00;
            background: rgba(0, 255, 0, 0.1);
            text-align: center;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.3s ease;
        }

        .skill-node:hover {
            background: rgba(0, 255, 0, 0.3);
        }

        .skill-node.learned {
            background: rgba(255, 255, 0, 0.3);
            border-color: #ffff00;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, #00ff00, #00aa00);
            color: black;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 2000;
            display: none;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .controls-help {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-size: 10px;
            border: 1px solid #00ff00;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">CYBER DUNGEON</div>
            <div class="floor-info">Floor: <span id="currentFloor">1</span></div>
            <div>Score: <span id="gameScore">0</span></div>
        </div>

        <div class="left-panel">
            <div class="stat-section">
                <div class="section-title">CHARACTER</div>
                <div>Level: <span id="playerLevel">1</span></div>
                <div>Class: <span id="playerClass">Hacker</span></div>
                
                <div style="margin-top: 8px;">
                    <div>HP: <span id="currentHp">100</span>/<span id="maxHp">100</span></div>
                    <div class="stat-bar">
                        <div class="stat-fill hp-fill" id="hpBar" style="width: 100%"></div>
                    </div>
                    
                    <div>Energy: <span id="currentEnergy">100</span>/<span id="maxEnergy">100</span></div>
                    <div class="stat-bar">
                        <div class="stat-fill energy-fill" id="energyBar" style="width: 100%"></div>
                    </div>
                    
                    <div>XP: <span id="currentXp">0</span>/<span id="nextLevelXp">100</span></div>
                    <div class="stat-bar">
                        <div class="stat-fill xp-fill" id="xpBar" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="stat-section">
                <div class="section-title">EQUIPMENT</div>
                <div style="display: flex; flex-wrap: wrap;">
                    <div class="equipment-slot" id="weaponSlot" title="Weapon">W</div>
                    <div class="equipment-slot" id="armorSlot" title="Armor">A</div>
                    <div class="equipment-slot" id="accessorySlot" title="Accessory">R</div>
                </div>
            </div>

            <div class="stat-section">
                <div class="section-title">SKILLS</div>
                <div>Points: <span id="skillPoints">0</span></div>
                <div class="skill-tree" id="skillTree"></div>
            </div>
        </div>

        <div class="game-area">
            <div class="dungeon-grid" id="dungeonGrid"></div>
            
            <div class="combat-overlay" id="combatOverlay">
                <div class="enemy-display" id="enemyDisplay">VIRUS</div>
                <div>
                    <div>Enemy HP: <span id="enemyHp">50</span>/<span id="enemyMaxHp">50</span></div>
                    <div class="stat-bar" style="width: 200px; margin: 10px auto;">
                        <div class="stat-fill hp-fill" id="enemyHpBar" style="width: 100%"></div>
                    </div>
                </div>
                <div class="combat-actions">
                    <button class="action-btn" onclick="game.combatAction('attack')">Attack</button>
                    <button class="action-btn" onclick="game.combatAction('hack')">Hack</button>
                    <button class="action-btn" onclick="game.combatAction('defend')">Defend</button>
                    <button class="action-btn" onclick="game.combatAction('item')">Use Item</button>
                </div>
            </div>

            <div class="controls-help">
                <div>WASD/Arrow Keys: Move</div>
                <div>Space: Interact</div>
                <div>I: Inventory</div>
                <div>ESC: Menu</div>
            </div>
        </div>

        <div class="right-panel">
            <div class="stat-section">
                <div class="section-title">INVENTORY</div>
                <div class="inventory-grid" id="inventoryGrid"></div>
            </div>

            <div class="stat-section">
                <div class="section-title">STATS</div>
                <div>Attack: <span id="attackStat">10</span></div>
                <div>Defense: <span id="defenseStat">5</span></div>
                <div>Hack Power: <span id="hackStat">8</span></div>
                <div>Speed: <span id="speedStat">3</span></div>
                <div>Credits: <span id="credits">0</span></div>
            </div>

            <div class="minimap" id="minimap"></div>
        </div>

        <div class="bottom-panel">
            <div style="flex: 1;">
                <div class="section-title">ACTIONS</div>
                <button class="action-btn" onclick="game.useStairs()">Use Stairs</button>
                <button class="action-btn" onclick="game.rest()">Rest</button>
                <button class="action-btn" onclick="game.saveGame()">Save</button>
                <button class="action-btn" onclick="game.loadGame()">Load</button>
            </div>
            <div class="log-area" id="gameLog"></div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="cyber-dungeon.js"></script>
</body>
</html>
