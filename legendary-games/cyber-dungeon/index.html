<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Dungeon | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
<style>
.slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.slots > * { aspect-ratio: 1; border-radius: 6px; background: #E2E5EA; display: grid; place-items: center; font-weight: 800; font-size: 14px; box-shadow: inset 0 2px 0 rgba(0, 0, 0, .1); }
.slots > .occupied { background: #fff; box-shadow: 0 3px 0 #B9BEC8, inset 0 0 0 1.5px #C9CDD6; cursor: pointer; }
.log { height: 132px; overflow-y: auto; background: var(--screen); color: #C9F2B4; border-radius: 10px; padding: 10px 12px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
.foe { width: 150px; height: 150px; border-radius: 20px; display: grid; place-items: center; background: #2A1114; box-shadow: inset 0 0 0 3px var(--bad); font-weight: 800; font-size: 20px; }
.foe-hp { width: min(260px, 70vw); }
.foe-hp .meter { background: #2A313C; }
.note { position: fixed; top: 16px; right: 16px; z-index: 60; display: none; background: var(--ink); color: #fff; font-weight: 700; padding: 12px 16px; border-radius: 12px; box-shadow: 0 4px 0 rgba(0, 0, 0, .3); }
.fig { font-size: 14px; display: flex; justify-content: space-between; font-weight: 600; }

.map { width: 100%; max-width: min(720px, 92vh); }
  .dungeon-grid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 1px; width: 100%; }
.cell { aspect-ratio: 1; display: grid; place-items: center; font: 800 clamp(9px, 1.7vw, 17px)/1 var(--display); border-radius: 2px; }
.cell.wall { background: #2A313C; color: transparent; }
.cell.floor { background: #12171F; color: #3A4352; }
.cell.player { background: var(--plastic); color: var(--on-plastic); }
.cell.enemy { background: var(--bad); color: #fff; }
.cell.treasure { background: #FFC629; color: #14161B; }
.cell.stairs { background: #4BA3F5; color: #001A33; }
.equip { display: flex; gap: 8px; }
.equipment-slot { width: 44px; height: 44px; border-radius: 8px; background: #E2E5EA; display: grid; place-items: center; font-weight: 800; }
.equipment-slot.equipped { background: var(--ink); color: #fff; }
.skill-tree { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 8px; }
.skill-node { padding: 6px 2px; border-radius: 6px; background: #E2E5EA; text-align: center; font-size: 10.5px; line-height: 1.15; text-transform: capitalize; overflow-wrap: anywhere; font-weight: 700; cursor: pointer; }
.skill-node:hover { background: #D5D9E0; }
.skill-node.learned { background: var(--ink); color: #fff; }
.key-map { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: #B9C0CC; padding-top: 10px; }
.key-map i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.screen { align-content: center; }
</style>
</head>
<body data-game="dungeon" data-pad="arrows space:Interact">

<main class="console">
  <div class="lcd">
    <div class="read "><span class="read__label">Floor</span><span class="read__value" id="currentFloor">1</span></div>
    <div class="read "><span class="read__label">Level</span><span class="read__value" id="playerLevel">1</span></div>
    <div class="read "><span class="read__label">Credits</span><span class="read__value" id="credits">0</span></div>
    <div class="read lcd__push"><span class="read__label">Score</span><span class="read__value" id="gameScore">0</span></div>
  </div>
  <div class="deck deck--three">
    <aside class="panel">
      <div class="plate"><h2>Hacker</h2>
        <div class="fig"><span>Health</span><span><span id="currentHp">100</span>/<span id="maxHp">100</span></span></div>
        <div class="meter"><i class="stat-fill is-hp" id="hpBar" style="width:100%"></i></div>
        <div class="fig"><span>Energy</span><span><span id="currentEnergy">100</span>/<span id="maxEnergy">100</span></span></div>
        <div class="meter"><i class="stat-fill is-mp" id="energyBar" style="width:100%"></i></div>
        <div class="fig"><span>Experience</span><span><span id="currentXp">0</span>/<span id="nextLevelXp">100</span></span></div>
        <div class="meter"><i class="stat-fill is-xp" id="xpBar" style="width:0"></i></div>
      </div>
      <div class="plate"><h2>Equipped</h2>
        <div class="equip">
          <div class="equipment-slot" id="weaponSlot" title="Weapon">W</div>
          <div class="equipment-slot" id="armorSlot" title="Armor">A</div>
          <div class="equipment-slot" id="accessorySlot" title="Accessory">R</div>
        </div>
      </div>
      <div class="plate"><h2>Skills</h2>
        <div class="row"><span>Points to spend</span><b id="skillPoints">0</b></div>
        <div class="skill-tree" id="skillTree"></div>
      </div>
    </aside>

    <div class="panel">
      <div class="screen">
        <div class="map">
          <div class="dungeon-grid" id="dungeonGrid" aria-label="Dungeon map"></div>
          <div class="key-map">
            <span><i style="background:var(--plastic)"></i>You</span>
            <span><i style="background:var(--bad)"></i>Enemy</span>
            <span><i style="background:#FFC629"></i>Treasure</span>
            <span><i style="background:#4BA3F5"></i>Stairs</span>
          </div>
        </div>
        <div class="overlay" id="combatOverlay">
          <div class="overlay__in">
            <div class="foe" id="enemyDisplay">VIRUS</div>
            <div class="foe-hp">
              <p>Enemy health <span id="enemyHp">50</span>/<span id="enemyMaxHp">50</span></p>
              <div class="meter"><i class="stat-fill is-hp" id="enemyHpBar" style="width:100%"></i></div>
            </div>
            <div class="btns btns--wrap" style="justify-content:center">
              <button class="btn" type="button" onclick="game.combatAction('attack')">Attack</button>
              <button class="btn" type="button" onclick="game.combatAction('hack')">Hack</button>
              <button class="btn" type="button" onclick="game.combatAction('defend')">Defend</button>
              <button class="btn" type="button" onclick="game.combatAction('item')">Use item</button>
            </div>
          </div>
        </div>
      </div>
      <div class="btns btns--wrap">
        <button class="btn btn--primary" type="button" onclick="game.useStairs()">Use stairs</button>
        <button class="btn" type="button" onclick="game.rest()">Rest</button>
        <button class="btn" type="button" onclick="game.saveGame()">Save</button>
        <button class="btn" type="button" onclick="game.loadGame()">Load</button>
      </div>
    </div>

    <aside class="panel">
      <div class="plate"><h2>Inventory</h2><div class="slots" id="inventoryGrid"></div></div>
      <div class="plate"><h2>Stats</h2>
        <div class="row"><span>Attack</span><b id="attackStat">10</b></div>
        <div class="row"><span>Defense</span><b id="defenseStat">5</b></div>
        <div class="row"><span>Hack power</span><b id="hackStat">8</b></div>
        <div class="row"><span>Speed</span><b id="speedStat">3</b></div>
        <p id="minimap" style="margin-top:6px"></p>
      </div>
      <div class="log" id="gameLog" aria-live="polite"></div>
    </aside>
  </div>
  <div class="legend">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows to move</span>
    <span><kbd>Space</kbd> interact</span>
  </div>
</main>
<div class="note" id="notification" role="status"></div>

<template id="howto">
<ul>
  <li>Walk the floor with the arrow keys. Bump into an enemy to start a turn-based fight.</li>
  <li>In a fight, Attack is free, Hack costs energy and hits harder, and Defend softens the next blow.</li>
  <li>Step on treasure to collect it. Select an item in your inventory to use or equip it.</li>
  <li>Stand on the stairs and choose Use stairs to go deeper. Rest restores health and energy.</li>
  <li>Levelling up earns skill points. Select a skill to spend one.</li>
  <li>Save keeps your run in this browser; Load brings it back.</li>
</ul>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="cyber-dungeon.js"></script>
</body>
</html>
