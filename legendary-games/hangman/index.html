<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangman | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
<style>
  .stage { display: grid; grid-template-columns: minmax(160px, 260px) minmax(0, 1fr); gap: 8px 32px; align-items: center; width: 100%; padding: 18px 14px; min-height: 340px; }
  .gallows { width: 100%; max-height: 300px; }
  .gallows path, .gallows circle { fill: none; stroke: #EEF1F5; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .gallows .frame { stroke: #5A6372; }
  .gallows .part { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .gallows .part.is-on { stroke-dashoffset: 0; transition: stroke-dashoffset .45s ease-out; }
  .gallows.is-lost .part { stroke: var(--bad); }

  .word { display: flex; flex-wrap: wrap; gap: 10px 8px; justify-content: flex-start; }
  .slot {
    width: clamp(26px, 5.2vw, 52px); height: clamp(40px, 7vw, 68px); display: grid; place-items: end center;
    border-bottom: 5px solid #5A6372; font-weight: 800; font-size: clamp(24px, 4.6vw, 48px); line-height: 1.1; text-transform: uppercase;
    font-stretch: 85%;
  }
  .slot.is-open { border-color: var(--plastic); }
  .slot.is-open span { animation: pop .22s ease-out; }
  .slot.is-missed { color: var(--bad); border-color: var(--bad); }
  @keyframes pop { from { transform: translateY(10px) scale(.7); opacity: 0; } }
  .said { margin-top: 18px; min-height: 1.5em; color: #B9C0CC; font-size: 15px; }
  .said b { color: #fff; }

  .lives { display: flex; gap: 5px; padding: 8px 0 3px; }
  .lives i { width: 16px; height: 16px; border-radius: 3px; background: var(--lcd-ink); }
  .lives i.is-gone { background: transparent; box-shadow: inset 0 0 0 2px rgba(29, 39, 19, .35); }

  .keys { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 8px 6px; max-width: 760px; margin: 4px auto 0; width: 100%; }
  .keys .btn { grid-column: span 2; padding: 12px 0 13px; font-size: 17px; font-weight: 800; }
  .keys .btn:nth-child(11) { grid-column: 2 / span 2; }
  .keys .btn:nth-child(20) { grid-column: 4 / span 2; }
  .keys .btn.is-hit { background: var(--good); color: #fff; box-shadow: 0 1px 0 #0d6a39; transform: translateY(3px); opacity: 1; }
  .keys .btn.is-miss { background: rgba(0, 0, 0, .18); color: var(--on-plastic); box-shadow: none; transform: translateY(4px); opacity: .6; text-decoration: line-through; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 6px 0 4px; }

  @media (max-width: 640px) {
    .stage { grid-template-columns: 1fr; justify-items: center; min-height: 0; padding: 8px 4px 14px; }
    .gallows { max-height: 170px; }
    .word { justify-content: center; }
    .said { text-align: center; }
    .keys { gap: 7px 4px; }
    .keys .btn { font-size: 15px; padding: 12px 0; border-radius: 8px; }
  }
</style>
</head>
<body data-game="hangman">

<main class="console console--mid">
  <div class="lcd" aria-live="polite">
    <div class="read read--text"><span class="read__label">Category</span><span class="read__value" id="category">Fruit</span></div>
    <div class="read"><span class="read__label">Lives</span><span class="lives" id="lives" role="img" aria-label="6 lives left"></span></div>
    <div class="read lcd__push"><span class="read__label">Streak</span><span class="read__value" id="streak">0</span></div>
    <div class="read"><span class="read__label">Best</span><span class="read__value" id="best">0</span></div>
  </div>

  <div class="screen">
    <div class="stage">
      <svg class="gallows" id="gallows" viewBox="0 0 200 230" role="img" aria-label="Gallows drawing">
        <path class="frame" d="M14 220 H124 M40 220 V14 H134 V40 M40 54 L80 14"/>
        <circle class="part" pathLength="1" cx="134" cy="60" r="20"/>
        <path class="part" pathLength="1" d="M134 80 V140"/>
        <path class="part" pathLength="1" d="M134 96 L108 122"/>
        <path class="part" pathLength="1" d="M134 96 L160 122"/>
        <path class="part" pathLength="1" d="M134 140 L112 182"/>
        <path class="part" pathLength="1" d="M134 140 L156 182"/>
      </svg>
      <div>
        <div class="word" id="word" aria-label="Word to guess"></div>
        <p class="said" id="said" aria-live="polite">Type a letter, or tap one below.</p>
      </div>
    </div>
    <div class="overlay" id="result">
      <div class="overlay__in">
        <h2 id="resultTitle">Solved</h2>
        <p id="resultText"></p>
        <div class="btns"><button class="btn" type="button" id="nextBtn">Next word</button></div>
      </div>
    </div>
  </div>

  <div class="keys" id="keys" aria-label="Letters"></div>
  <div class="actions">
    <button class="btn" type="button" id="hintBtn">Reveal a letter (costs 1 life)</button>
    <button class="btn" type="button" id="skipBtn">Skip this word</button>
  </div>
</main>

<template id="howto">
  <ul>
    <li>A hidden word is chosen from the category shown on the display.</li>
    <li>Guess one letter at a time with your keyboard or the keys on the console.</li>
    <li>A wrong letter costs a life and adds a stroke to the drawing. You have six.</li>
    <li>Stuck? Reveal a letter in exchange for one life.</li>
    <li>Solve words back to back to build a streak. Skipping or losing resets it.</li>
  </ul>
  <p><kbd>A</kbd>–<kbd>Z</kbd> guess &nbsp; <kbd>Enter</kbd> next word</p>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script>
(function () {
  const WORDS = {
    'Fruit': ['apple', 'banana', 'cherry', 'date', 'elderberry', 'fig', 'grape', 'honeydew', 'jackfruit', 'kiwi', 'lemon', 'mango', 'nectarine', 'orange', 'papaya', 'quince', 'raspberry', 'strawberry', 'tangerine', 'watermelon'],
    'In the kitchen': ['paprika', 'saffron', 'zucchini'],
    'Nature and science': ['blossom', 'daffodil', 'wisteria', 'bouquet', 'oasis', 'zephyr', 'galaxy', 'oceanic', 'quartz', 'xenon', 'vortex'],
    'Music and dance': ['flamenco', 'tango', 'melody', 'lullaby'],
    'Things you can point at': ['cathedral', 'gargoyle', 'igloo', 'kaleidoscope', 'yacht', 'dynamite', 'kitten'],
    'Feelings and ideas': ['abundance', 'ecstasy', 'happiness', 'imagination', 'serenity', 'triumph', 'wonder', 'yearning', 'laughter', 'elegance', 'majesty', 'radiance', 'rebellion', 'jubilee', 'narrative', 'hazard', 'pioneer'],
    'Describing words': ['ubiquitous', 'zestful', 'jovial', 'quixotic', 'vibrant', 'unbridled', 'nurturing'],
    'Doing words': ['accomplish', 'celebrate', 'flourish'],
  };
  const POOL = Object.entries(WORDS).flatMap(([cat, list]) => list.map(w => ({ cat, w })));
  const MAX = 6;
  const $ = id => document.getElementById(id);
  const parts = [...document.querySelectorAll('#gallows .part')];
  const keyEls = {};
  let word, cat, guessed, misses, over, streak = 0, best = 0, recent = [];

  try { best = +localStorage.getItem('hangman:best') || 0; } catch (e) {}

  'qwertyuiopasdfghjklzxcvbnm'.split('').forEach(ch => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn'; b.textContent = ch.toUpperCase();
    b.addEventListener('click', () => { guess(ch); b.blur(); });
    $('keys').append(b); keyEls[ch] = b;
  });

  function pick() {
    let c;
    do { c = POOL[Math.floor(Math.random() * POOL.length)]; } while (recent.includes(c.w));
    recent.push(c.w); if (recent.length > 25) recent.shift();
    return c;
  }

  function start() {
    ({ w: word, cat } = pick());
    guessed = new Set(); misses = 0; over = false;
    $('category').textContent = cat;
    $('result').style.display = 'none';
    $('gallows').classList.remove('is-lost');
    parts.forEach(p => p.classList.remove('is-on'));
    Object.values(keyEls).forEach(b => { b.className = 'btn'; b.disabled = false; });
    $('hintBtn').disabled = false; $('skipBtn').disabled = false;
    $('said').textContent = `${word.length} letters. Type a letter, or tap one below.`;
    draw();
  }

  function draw(popLetter) {
    $('word').innerHTML = '';
    [...word].forEach(ch => {
      const s = document.createElement('div');
      const open = guessed.has(ch);
      s.className = 'slot' + (open ? ' is-open' : (over ? ' is-missed' : ''));
      if (open || over) s.innerHTML = ch === popLetter ? `<span>${ch}</span>` : ch;
      $('word').append(s);
    });
    const left = MAX - misses;
    $('lives').innerHTML = Array.from({ length: MAX }, (_, i) => `<i class="${i < left ? '' : 'is-gone'}"></i>`).join('');
    $('lives').setAttribute('aria-label', `${left} lives left`);
    $('streak').textContent = streak; $('best').textContent = best;
    $('hintBtn').disabled = over || left <= 1;
  }

  function miss() {
    misses++;
    if (parts[misses - 1]) parts[misses - 1].classList.add('is-on');
  }

  function guess(ch) {
    if (over || guessed.has(ch) || !keyEls[ch] || keyEls[ch].disabled) return;
    keyEls[ch].disabled = true;
    if (word.includes(ch)) {
      guessed.add(ch);
      keyEls[ch].classList.add('is-hit');
      const n = [...word].filter(c => c === ch).length;
      $('said').innerHTML = `<b>${ch.toUpperCase()}</b> is in the word${n > 1 ? ` ${n} times` : ''}.`;
    } else {
      keyEls[ch].classList.add('is-miss');
      miss();
      const left = MAX - misses;
      $('said').innerHTML = `No <b>${ch.toUpperCase()}</b>. ${left} ${left === 1 ? 'life' : 'lives'} left.`;
    }
    check(ch);
  }

  function check(ch) {
    const won = [...word].every(c => guessed.has(c));
    const lost = misses >= MAX;
    if (won || lost) {
      over = true;
      if (won) { streak++; if (streak > best) { best = streak; try { localStorage.setItem('hangman:best', best); } catch (e) {} } }
      else { streak = 0; $('gallows').classList.add('is-lost'); }
      $('skipBtn').disabled = true;
      setTimeout(() => finish(won), won ? 650 : 900);
    }
    draw(ch);
  }

  function finish(won) {
    $('resultTitle').textContent = won ? 'Solved' : 'Out of lives';
    $('resultText').innerHTML = won
      ? `<b>${word.toUpperCase()}</b><br>${misses === 0 ? 'Not a single miss.' : `With ${MAX - misses} ${MAX - misses === 1 ? 'life' : 'lives'} to spare.`} Streak: ${streak}.`
      : `The word was <b>${word.toUpperCase()}</b>`;
    $('result').style.display = 'block';
    $('nextBtn').focus();
  }

  $('hintBtn').addEventListener('click', () => {
    if (over || MAX - misses <= 1) return;
    const hidden = [...new Set(word)].filter(c => !guessed.has(c));
    const ch = hidden[Math.floor(Math.random() * hidden.length)];
    guessed.add(ch); keyEls[ch].disabled = true; keyEls[ch].classList.add('is-hit');
    miss();
    $('said').innerHTML = `Revealed <b>${ch.toUpperCase()}</b> for one life.`;
    check(ch);
  });
  $('skipBtn').addEventListener('click', () => { if (!over) { streak = 0; start(); } });
  $('nextBtn').addEventListener('click', start);

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector('dialog[open]')) return;
    if (over && e.key === 'Enter') { e.preventDefault(); if ($('result').style.display === 'block') start(); return; }
    if (/^[a-z]$/i.test(e.key)) guess(e.key.toLowerCase());
  });

  start();
})();
</script>
</body>
</html>
