<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNO | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
<style>
.table { width: 100%; display: grid; gap: 18px; justify-items: center; padding: 10px 4px; min-height: 480px; align-content: space-between; }
.card {
  flex: none; width: 74px; aspect-ratio: 5 / 7; border-radius: 10px; display: grid; place-items: center; text-align: center;
  font: 800 30px/1 var(--display); color: #fff; background: #2A313C; border: 4px solid #fff;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .45); user-select: none; -webkit-user-select: none; transition: transform .1s ease;
}
.card.red { background: #E5484D; } .card.blue { background: #2F6FDB; } .card.green { background: #1E9E5A; }
.card.yellow { background: #F6BE0F; color: #14161B; }
.card.wild { background: conic-gradient(#E5484D 0 25%, #2F6FDB 0 50%, #F6BE0F 0 75%, #1E9E5A 0); text-shadow: 0 2px 0 rgba(0, 0, 0, .6); }
.hand { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
#computerHand { flex-wrap: nowrap; gap: 0; padding-left: 40px; }
#computerHand .card { width: 52px; font-size: 12px; margin-left: -30px; border-width: 3px; color: #8E97A6; }
#playerHand .card { cursor: pointer; }
#playerHand .card:hover { transform: translateY(-8px); }
.piles { display: flex; gap: 22px; align-items: center; }
.piles .card { width: 96px; font-size: 40px; }
#drawPile { font-size: 20px; color: #8E97A6; cursor: pointer; box-shadow: 0 3px 0 rgba(0, 0, 0, .45), 5px 6px 0 -1px #2A313C, 5px 6px 0 2px #fff; }
.inplay { display: grid; gap: 4px; justify-items: center; font-size: 13px; color: #B9C0CC; }
.inplay i { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #fff; background: #2A313C; }
.inplay i.red { background: #E5484D; } .inplay i.blue { background: #2F6FDB; } .inplay i.green { background: #1E9E5A; } .inplay i.yellow { background: #F6BE0F; }
.say { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 6; display: none; background: #fff; color: var(--ink); font-weight: 700; padding: 10px 16px; border-radius: 10px; white-space: nowrap; box-shadow: 0 4px 0 rgba(0, 0, 0, .4); }
.swatches { display: grid; grid-template-columns: repeat(2, 84px); gap: 12px; }
.color-option { height: 84px; border-radius: 14px; border: 4px solid #fff; cursor: pointer; }
.who { font-size: 13px; color: #8E97A6; font-weight: 600; }
@media (max-width: 560px) { .card { width: 56px; font-size: 24px; } .piles .card { width: 78px; } .table { min-height: 420px; } }
</style>
</head>
<body data-game="uno">

<main class="console console--mid">
  <div class="lcd">
    <div class="read read--text"><span class="read__label">Turn</span><span class="read__value" id="currentPlayer">You</span></div>
    <div class="read lcd__push"><span class="read__label">Your cards</span><span class="read__value" id="playerCardCount">7</span></div>
    <div class="read "><span class="read__label">Computer cards</span><span class="read__value" id="computerCardCount">7</span></div>
  </div>
  <div class="screen">
    <div class="table">
      <div><p class="who">Computer</p><div class="hand" id="computerHand"></div></div>
      <div class="piles">
        <div class="card" id="drawPile" role="button" tabindex="0" aria-label="Draw a card" onclick="document.getElementById('drawBtn').click()">UNO</div>
        <div class="card" id="discardPile" aria-label="Discard pile"></div>
        <div class="inplay"><i id="colorNow"></i>Colour in play</div>
      </div>
      <div><div class="hand" id="playerHand" aria-label="Your hand"></div></div>
    </div>
    <div class="say" id="message" role="status"></div>
    <div class="overlay" id="colorSelector">
      <div class="overlay__in">
        <h2>Pick a colour</h2>
        <div class="swatches">
          <button type="button" class="color-option" style="background:#E5484D" data-color="red" aria-label="Red"></button>
          <button type="button" class="color-option" style="background:#2F6FDB" data-color="blue" aria-label="Blue"></button>
          <button type="button" class="color-option" style="background:#1E9E5A" data-color="green" aria-label="Green"></button>
          <button type="button" class="color-option" style="background:#F6BE0F" data-color="yellow" aria-label="Yellow"></button>
        </div>
      </div>
    </div>
  </div>
  <div class="btns btns--wrap">
    <button class="btn btn--primary" type="button" id="drawBtn">Draw a card</button>
    <button class="btn" type="button" id="unoBtn">Call UNO</button>
    <button class="btn" type="button" id="newGameBtn">New game</button>
  </div>
</main>

<template id="howto">
<ul>
  <li>On your turn, play a card that matches the top of the discard pile by colour or by number or symbol.</li>
  <li>Nothing to play? Draw a card from the deck.</li>
  <li>When you are down to one card, call UNO. First to empty their hand wins.</li>
</ul>
<h3>Special cards</h3>
<ul>
  <li><b>Skip</b> (the barred circle) and <b>Reverse</b> (the arrows) both make your opponent miss a turn.</li>
  <li><b>+2</b> makes them draw two.</li>
  <li><b>Wild</b> lets you choose the colour. <b>+4</b> does the same and makes them draw four.</li>
</ul>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="uno.js"></script>
</body>
</html>
