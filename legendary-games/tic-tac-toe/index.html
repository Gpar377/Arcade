<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
<style>
.console { max-width: 600px; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(100%, 56vh, 460px); aspect-ratio: 1; }
.cell { appearance: none; border: 0; border-radius: 14px; background: #1B212B; color: #fff; cursor: pointer; font: 800 clamp(44px, 12vh, 96px)/1 var(--display); box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .35); }
.cell:hover:empty { background: #252D39; }
.cell.o { color: var(--plastic); }
.cell.winning { background: var(--plastic); color: var(--on-plastic); }
.opts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.opts label { font-weight: 600; font-size: 14px; }
</style>
</head>
<body data-game="tictactoe">

<main class="console console--narrow">
  <div class="lcd">
    <div class="read "><span class="read__label">Turn</span><span class="read__value" id="currentPlayer">X</span></div>
    <div class="read lcd__push"><span class="read__label">X wins</span><span class="read__value" id="xScore">0</span></div>
    <div class="read "><span class="read__label">O wins</span><span class="read__value" id="oScore">0</span></div>
    <div class="read "><span class="read__label">Draws</span><span class="read__value" id="drawScore">0</span></div>
  </div>
  <div class="screen">
    <div class="board" id="gameBoard" aria-label="Tic-tac-toe board"></div>
    <div class="overlay" id="gameOver">
      <div class="overlay__in">
        <h2 id="gameResult">Game over</h2>
        <p id="gameMessage"></p>
        <div class="btns"><button class="btn" type="button" onclick="game.newGame(); document.getElementById('gameOver').style.display='none';">Play again</button></div>
      </div>
    </div>
  </div>
  <div class="opts">
    <button class="btn btn--primary" type="button" onclick="game.newGame()">New game</button>
    <button class="btn" type="button" aria-pressed="false" onclick="game.toggleAI(); this.setAttribute('aria-pressed', game.aiEnabled)">Play against the computer</button>
    <label for="difficulty">Computer level</label>
    <select class="pick" id="difficulty" onchange="game.setDifficulty(this.value)">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard" selected>Hard</option>
    </select>
    <button class="btn btn--danger" type="button" onclick="game.resetScore()">Reset score</button>
  </div>
</main>

<template id="howto">
<ul>
  <li>X goes first. Take turns claiming a square.</li>
  <li>Three in a row wins: across, down or diagonally. A full board with no line is a draw.</li>
  <li>Switch on the computer to play O against it, and pick how hard it tries. On Hard it does not lose.</li>
</ul>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="tictactoe.js"></script>
</body>
</html>
