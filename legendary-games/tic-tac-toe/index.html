<!DOCTYPE html>
<html>
<head>
    <title>Ultimate Tic-Tac-Toe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        
        .game-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .current-player {
            font-size: 20px;
            font-weight: bold;
        }
        
        .score {
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: bold;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 15px;
        }
        
        .cell {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 10px;
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cell:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .cell.x {
            color: #e74c3c;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .cell.o {
            color: #3498db;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .cell.winning {
            background: #f1c40f !important;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .difficulty {
            margin-top: 20px;
        }
        
        .difficulty select {
            padding: 8px 16px;
            border-radius: 5px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-weight: bold;
        }
        
        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 1000;
            border: 2px solid #f1c40f;
        }
        
        .game-over h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #f1c40f;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">❌ TIC-TAC-TOE ⭕</h1>
        
        <div class="game-info">
            <div class="current-player">
                Current Player: <span id="currentPlayer">X</span>
            </div>
            <div class="score">
                <div>X Wins: <span id="xScore">0</span></div>
                <div>O Wins: <span id="oScore">0</span></div>
                <div>Draws: <span id="drawScore">0</span></div>
            </div>
        </div>
        
        <div class="board" id="gameBoard"></div>
        
        <div class="controls">
            <button class="btn" onclick="game.newGame()">New Game</button>
            <button class="btn" onclick="game.toggleAI()">Toggle AI</button>
            <button class="btn" onclick="game.resetScore()">Reset Score</button>
        </div>
        
        <div class="difficulty">
            <label for="difficulty">AI Difficulty: </label>
            <select id="difficulty" onchange="game.setDifficulty(this.value)">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard" selected>Hard</option>
            </select>
        </div>
    </div>
    
    <div class="game-over" id="gameOver">
        <h2 id="gameResult">Game Over</h2>
        <p id="gameMessage">Great game!</p>
        <button class="btn" onclick="game.newGame(); document.getElementById('gameOver').style.display='none';">Play Again</button>
    </div>
    
    <script src="tictactoe.js"></script>
</body>
</html>
