<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Racer | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
</head>
<body data-game="racer" data-pad="wasd space:Nitro r:Restart">

<main class="console console--mid">
  <div class="lcd">
    <div class="read "><span class="read__label">Speed, km/h</span><span class="read__value" id="speed">0</span></div>
    <div class="read "><span class="read__label">Distance, m</span><span class="read__value" id="distance">0</span></div>
    <div class="read lcd__push"><span class="read__label">Score</span><span class="read__value" id="score">0</span></div>
  </div>
  <div class="screen">
    <canvas id="gameCanvas" width="800" height="600" aria-label="Race track"></canvas>
    <div class="overlay" id="gameOver">
      <div class="overlay__in">
        <h2>Race over</h2>
        <p>Distance <span id="finalDistance">0</span> m &nbsp; Top speed <span id="topSpeed">0</span> km/h</p>
        <div class="btns"><button class="btn" type="button" onclick="game.restart()">Race again</button></div>
      </div>
    </div>
  </div>
  <div class="legend">
    <span><kbd>A</kbd><kbd>D</kbd> steer</span>
    <span><kbd>W</kbd> accelerate</span>
    <span><kbd>S</kbd> brake</span>
    <span><kbd>Space</kbd> nitro</span>
    <span><kbd>R</kbd> restart</span>
  </div>
</main>

<template id="howto">
<ul>
  <li>Stay on the road and dodge the traffic. One crash ends the race.</li>
  <li>The faster and further you go, the higher your score.</li>
  <li>Nitro gives a short burst of speed.</li>
</ul>
<p><kbd>A</kbd><kbd>D</kbd> steer &nbsp; <kbd>W</kbd> accelerate &nbsp; <kbd>S</kbd> brake &nbsp; <kbd>Space</kbd> nitro &nbsp; <kbd>R</kbd> restart</p>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="racing.js"></script>
</body>
</html>
