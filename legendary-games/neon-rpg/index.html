<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon RPG | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
<style>
.slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.slots > * { aspect-ratio: 1; border-radius: 6px; background: #E2E5EA; display: grid; place-items: center; font-weight: 800; font-size: 14px; box-shadow: inset 0 2px 0 rgba(0, 0, 0, .1); }
.slots > .occupied { background: #fff; box-shadow: 0 3px 0 #B9BEC8, inset 0 0 0 1.5px #C9CDD6; cursor: pointer; }
.log { height: 132px; overflow-y: auto; background: var(--screen); color: #C9F2B4; border-radius: 10px; padding: 10px 12px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
.foe { width: 150px; height: 150px; border-radius: 20px; display: grid; place-items: center; background: #2A1114; box-shadow: inset 0 0 0 3px var(--bad); font-weight: 800; font-size: 20px; }
.foe-hp { width: min(260px, 70vw); }
.foe-hp .meter { background: #2A313C; }
.note { position: fixed; top: 16px; right: 16px; z-index: 60; display: none; background: var(--ink); color: #fff; font-weight: 700; padding: 12px 16px; border-radius: 12px; box-shadow: 0 4px 0 rgba(0, 0, 0, .3); }
.fig { font-size: 14px; display: flex; justify-content: space-between; font-weight: 600; }

.slots { grid-template-columns: repeat(4, 1fr); }
.screen { padding: 0; }
.screen canvas.world-map { width: 100%; height: min(56vh, 520px); max-height: none; cursor: pointer; }
.particles { display: none; }
.quest-item { font-size: 13.5px; padding: 8px 0; border-top: 1.5px dashed #D3D7DE; color: var(--ink-2); }
.quest-item:first-child { border-top: 0; padding-top: 0; }
.quest-item strong { color: var(--ink); }
.quest-item.completed { opacity: .5; text-decoration: line-through; }
.shop-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; width: min(640px, 86vw); }
.shop-item { background: #fff; color: var(--ink); border-radius: 12px; padding: 12px; text-align: left; cursor: pointer; box-shadow: 0 4px 0 rgba(0, 0, 0, .4); }
.shop-item:hover { background: #F1F3F6; }
.shop-item h3 { font-size: 16px; font-weight: 800; }
.shop-item p { color: var(--ink-2); font-size: 13px; max-width: none; }
.wide { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 560px) { .wide { grid-template-columns: 1fr; } }
</style>
</head>
<body data-game="rpg">

<main class="console">
  <div class="lcd">
    <div class="read read--text"><span class="read__label">Hero</span><span class="read__value" id="playerName">Hero</span></div>
    <div class="read read--text"><span class="read__label">Class</span><span class="read__value" id="playerClass">Warrior</span></div>
    <div class="read lcd__push"><span class="read__label">Level</span><span class="read__value" id="playerLevel">1</span></div>
    <div class="read "><span class="read__label">Gold</span><span class="read__value" id="playerGold">100</span></div>
  </div>
  <div class="deck deck--left">
    <aside class="panel">
      <div class="plate"><h2>Condition</h2>
        <div class="fig"><span>Health</span><span><span id="currentHp">100</span>/<span id="maxHp">100</span></span></div>
        <div class="meter"><i class="stat-fill is-hp" id="hpBar" style="width:100%"></i></div>
        <div class="fig"><span>Magic</span><span><span id="currentMp">50</span>/<span id="maxMp">50</span></span></div>
        <div class="meter"><i class="stat-fill is-mp" id="mpBar" style="width:100%"></i></div>
        <div class="fig"><span>Experience</span><span><span id="currentXp">0</span>/<span id="nextLevelXp">100</span></span></div>
        <div class="meter"><i class="stat-fill is-xp" id="xpBar" style="width:0"></i></div>
      </div>
      <div class="plate"><h2>Inventory</h2><div class="slots" id="inventory"></div></div>
      <div class="plate"><h2>Quests</h2><div id="questList"></div></div>
    </aside>
    <div class="panel">
      <div class="screen">
        <canvas class="world-map" id="worldCanvas" width="620" height="440" aria-label="World map. Select a place to travel there."></canvas>
        <div class="particles" id="particles"></div>
        <div class="overlay" id="combatScreen">
          <div class="overlay__in">
            <div class="foe" id="enemy"><div id="enemyName">Goblin</div></div>
            <div class="foe-hp">
              <p>Enemy health <span id="enemyHp">50</span>/<span id="enemyMaxHp">50</span></p>
              <div class="meter"><i class="stat-fill is-hp" id="enemyHpBar" style="width:100%"></i></div>
            </div>
            <div class="btns btns--wrap" style="justify-content:center">
              <button class="btn" type="button" onclick="game.attack()">Attack</button>
              <button class="btn" type="button" onclick="game.useSkill()">Magic</button>
              <button class="btn" type="button" onclick="game.useItem()">Use item</button>
              <button class="btn" type="button" onclick="game.flee()">Flee</button>
            </div>
          </div>
        </div>
        <div class="overlay" id="shopScreen">
          <div class="overlay__in">
            <h2>Shop</h2>
            <p>You have <span id="shopGold">100</span> gold. Select an item to buy it.</p>
            <div class="shop-items" id="shopItems"></div>
            <div class="btns"><button class="btn" type="button" onclick="game.closeShop()">Leave the shop</button></div>
          </div>
        </div>
      </div>
      <div class="wide">
        <div class="btns">
          <button class="btn btn--primary" type="button" onclick="game.explore()">Explore</button>
          <button class="btn" type="button" onclick="game.rest()">Rest</button>
          <button class="btn" type="button" onclick="game.openShop()">Visit the shop</button>
        </div>
        <div class="log" id="gameLog" aria-live="polite"></div>
      </div>
    </div>
  </div>
</main>
<div class="note" id="levelUpNotification" role="status">Level up</div>

<template id="howto">
<ul>
  <li>Select a place on the map to travel there.</li>
  <li>Explore to look for trouble: you may meet an enemy, find gold, or find nothing.</li>
  <li>In a fight, Attack is free, Magic costs magic points, and Flee gets you out.</li>
  <li>Winning fights earns experience and gold, and moves your quests along.</li>
  <li>Rest restores health and magic. Spend gold in the shop, then select an item in your inventory to use it.</li>
</ul>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="rpg.js"></script>
</body>
</html>
