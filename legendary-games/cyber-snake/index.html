<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Snake | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
</head>
<body data-game="snake" data-pad="arrows space:Pause r:Restart">

<main class="console console--narrow">
  <div class="lcd">
    <div class="read "><span class="read__label">Score</span><span class="read__value" id="score">0</span></div>
    <div class="read "><span class="read__label">Length</span><span class="read__value" id="length">1</span></div>
    <div class="read lcd__push"><span class="read__label">Best</span><span class="read__value" id="highScore">0</span></div>
  </div>
  <div class="screen">
    <canvas id="gameCanvas" width="600" height="600" aria-label="Snake playfield"></canvas>
    <div class="overlay" id="gameOver">
      <div class="overlay__in">
        <h2>Game over</h2>
        <p>Score <span id="finalScore">0</span> &nbsp; Length <span id="finalLength">1</span></p>
        <div class="btns"><button class="btn" type="button" onclick="game.restart()">Play again</button></div>
      </div>
    </div>
  </div>
  <div class="legend">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows to steer</span>
    <span><kbd>Space</kbd> pause</span>
    <span><kbd>R</kbd> restart</span>
  </div>
</main>

<template id="howto">
<ul>
  <li>Press any arrow key to start. Steer into food to grow and score 10 points.</li>
  <li>Hitting a wall, your own tail, or a bomb ends the run.</li>
</ul>
<h3>Pick-ups</h3>
<ul>
  <li><b>Speed boost</b> makes the snake faster for a while.</li>
  <li><b>Shield</b> lets you pass through walls.</li>
  <li><b>Multiplier</b> doubles your points.</li>
  <li><b>Bomb</b> is the one to avoid.</li>
</ul>
<p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows steer &nbsp; <kbd>Space</kbd> pause &nbsp; <kbd>R</kbd> restart</p>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="snake.js"></script>
</body>
</html>
