<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Breakout | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
</head>
<body data-game="breakout" data-pad="lr space:Launch p:Pause">

<main class="console">
  <div class="lcd">
    <div class="read "><span class="read__label">Score</span><span class="read__value" id="score">0</span></div>
    <div class="read "><span class="read__label">Level</span><span class="read__value" id="level">1</span></div>
    <div class="read "><span class="read__label">Lives</span><span class="read__value" id="lives">3</span></div>
    <div class="read "><span class="read__label">Bricks left</span><span class="read__value" id="bricksLeft">0</span></div>
    <div class="read lcd__push"><span class="read__label">Best</span><span class="read__value" id="highScore">0</span></div>
  </div>
  <div class="deck">
    <div class="screen">
      <canvas id="gameCanvas" width="800" height="600" aria-label="Breakout playfield"></canvas>
      <span id="fpsCounter" hidden></span>
      <div class="overlay" id="gameOverlay">
        <div class="overlay__in">
          <h2 id="overlayTitle">Paused</h2>
          <p id="overlayMessage">Press P to resume.</p>
          <div class="btns">
            <button class="btn" type="button" onclick="game.resumeGame()">Resume</button>
            <button class="btn" type="button" onclick="game.resetGame()">New game</button>
          </div>
        </div>
      </div>
    </div>
    <aside class="panel">
      <div class="plate"><h2>Level progress</h2><div class="meter"><i class="is-go" id="progressBar" style="width:0"></i></div></div>
      <div class="btns">
        <button class="btn btn--primary" type="button" onclick="game.startGame()">Start game</button>
        <button class="btn" type="button" onclick="game.pauseGame()">Pause or resume</button>
        <button class="btn" type="button" onclick="game.resetGame()">New game</button>
        <button class="btn btn--danger" type="button" onclick="game.resetHighScore()">Reset best score</button>
      </div>
    </aside>
  </div>
  <div class="legend">
    <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> or <kbd>A</kbd><kbd>D</kbd> move the paddle</span>
    <span><kbd>Space</kbd> launch, fire lasers</span>
    <span><kbd>P</kbd> pause</span>
    <span><kbd>R</kbd> reset</span>
  </div>
</main>

<template id="howto">
<ul>
  <li>Launch the ball and keep it in play with the paddle. Break every brick to reach the next level.</li>
  <li>Miss the ball and you lose one of three lives.</li>
</ul>
<h3>Power-ups fall from broken bricks</h3>
<ul>
  <li><b>Fire ball</b> burns through several bricks.</li>
  <li><b>Multi ball</b> splits into three.</li>
  <li><b>Mega paddle</b> widens your paddle.</li>
  <li><b>Bonus points</b> doubles your score for a while.</li>
  <li><b>Laser paddle</b> lets you shoot with Space.</li>
</ul>
<p><kbd>&larr;</kbd><kbd>&rarr;</kbd> move &nbsp; <kbd>Space</kbd> launch or fire &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>R</kbd> reset</p>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="breakout.js"></script>
</body>
</html>
