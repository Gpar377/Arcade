<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Neon | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
<style>
.console { max-width: 520px; }
.screen canvas { touch-action: manipulation; cursor: pointer; }
.record { color: #FFC629 !important; font-weight: 700; }
</style>
</head>
<body data-game="flappy" data-pad="space:Flap">

<main class="console console--narrow">
  <div class="lcd">
    <div class="read "><span class="read__label">Score</span><span class="read__value" id="score">0</span></div>
    <div class="read read--text"><span class="read__label">Difficulty</span><span class="read__value" id="difficulty">Easy</span></div>
    <div class="read lcd__push"><span class="read__label">Best</span><span class="read__value" id="highScore">0</span></div>
  </div>
  <div class="screen">
    <canvas id="gameCanvas" width="400" height="600" aria-label="Flappy playfield"></canvas>
    <span id="fpsCounter" hidden></span>
    <div class="overlay" id="startScreen" style="display:block">
      <div class="overlay__in">
        <h2>Ready?</h2>
        <p>Tap, click or press Space to fly. Slip through the gaps and grab the power-ups.</p>
        <div class="btns"><button class="btn" type="button" onclick="game.startGame()">Start game</button></div>
      </div>
    </div>
    <div class="overlay" id="gameOverScreen">
      <div class="overlay__in">
        <h2>Game over</h2>
        <p id="finalScore">Score: 0</p>
        <p class="record" id="newRecord" style="display:none">New best score</p>
        <div class="btns">
          <button class="btn" type="button" onclick="game.restartGame()">Play again</button>
          <button class="btn" type="button" onclick="game.showStartScreen()">Back to start</button>
        </div>
      </div>
    </div>
  </div>
  <div class="legend"><span><kbd>Space</kbd> or click to flap</span></div>
</main>

<template id="howto">
<ul>
  <li>Each flap pushes you up; gravity does the rest. Fly through the gaps between the pipes.</li>
  <li>Every pipe you pass is a point. Touch a pipe or the ground and the run is over.</li>
  <li>Power-ups drift past now and then. Fly into them.</li>
  <li>The pipes come faster as your score climbs: Easy, Medium at 15, Hard at 30, Insane at 50.</li>
</ul>
<p><kbd>Space</kbd>, click or tap to flap</p>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="flappy.js"></script>
</body>
</html>
