<!DOCTYPE html>
<html>
<head>
    <title>War Commander</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: #ecf0f1;
            height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-right: 2px solid #e74c3c;
        }
        
        .game-area {
            flex: 1;
            position: relative;
        }
        
        canvas {
            background: #1a252f;
            cursor: crosshair;
        }
        
        .unit-info {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .unit-btn {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .unit-btn:hover {
            background: linear-gradient(45deg, #c0392b, #a93226);
        }
        
        .unit-btn.selected {
            background: linear-gradient(45deg, #27ae60, #229954);
        }
        
        .stats {
            font-size: 12px;
            margin-top: 20px;
        }
        
        .turn-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .player1 { color: #3498db; }
        .player2 { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="sidebar">
            <div class="unit-info">
                <h3>🎖️ WAR COMMANDER</h3>
                <p>Turn-based strategy warfare</p>
            </div>
            
            <div class="unit-info">
                <h4>Deploy Units:</h4>
                <button class="unit-btn" id="soldierBtn">👤 Soldier (HP:3, ATK:2)</button>
                <button class="unit-btn" id="tankBtn">🚗 Tank (HP:5, ATK:4)</button>
                <button class="unit-btn" id="aircraftBtn">✈️ Aircraft (HP:2, ATK:5)</button>
            </div>
            
            <div class="unit-info">
                <h4>Actions:</h4>
                <button class="unit-btn" id="moveBtn">🚶 Move Unit</button>
                <button class="unit-btn" id="attackBtn">⚔️ Attack</button>
                <button class="unit-btn" id="endTurnBtn">⏭️ End Turn</button>
            </div>
            
            <div class="stats">
                <h4>Player 1 (Blue):</h4>
                <p>Units: <span id="p1Units">0</span></p>
                <p>Resources: <span id="p1Resources">100</span></p>
                
                <h4>Player 2 (Red):</h4>
                <p>Units: <span id="p2Units">0</span></p>
                <p>Resources: <span id="p2Resources">100</span></p>
            </div>
        </div>
        
        <div class="game-area">
            <div class="turn-indicator" id="turnIndicator">
                <span class="player1">Player 1's Turn</span>
            </div>
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>
    </div>
    
    <script src="war.js"></script>
</body>
</html>
