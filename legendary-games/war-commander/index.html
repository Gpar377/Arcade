<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>War Commander | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
<style>
.screen canvas { cursor: crosshair; }
.player1, .player2 { display: inline-flex; align-items: center; gap: 8px; }
.player1::before, .player2::before { content: ''; width: .6em; height: .6em; border-radius: 3px; background: #2477C9; }
.player2::before { background: #D8362C; }
.unit-btn { display: flex; justify-content: space-between; gap: 10px; text-align: left; }
.unit-btn small { font: 700 15px var(--dots); opacity: .7; }
.side h2 { font-size: 14px; font-weight: 700; padding: 4px 2px 0; }
</style>
</head>
<body data-game="war">

<main class="console">
  <div class="lcd">
    <div class="read read--text"><span class="read__label">Turn</span><span class="read__value" id="turnIndicator"><span class="player1">Blue</span></span></div>
    <div class="read lcd__push"><span class="read__label">Blue units</span><span class="read__value" id="p1Units">0</span></div>
    <div class="read "><span class="read__label">Blue resources</span><span class="read__value" id="p1Resources">100</span></div>
    <div class="read "><span class="read__label">Red units</span><span class="read__value" id="p2Units">0</span></div>
    <div class="read "><span class="read__label">Red resources</span><span class="read__value" id="p2Resources">100</span></div>
  </div>
  <div class="deck">
    <div class="screen"><canvas id="gameCanvas" width="800" height="600" aria-label="Battlefield grid"></canvas></div>
    <aside class="panel side">
      <h2>Deploy a unit</h2>
      <div class="btns">
        <button class="btn unit-btn" type="button" id="soldierBtn">Soldier <small>20</small></button>
        <button class="btn unit-btn" type="button" id="tankBtn">Tank <small>50</small></button>
        <button class="btn unit-btn" type="button" id="aircraftBtn">Aircraft <small>40</small></button>
      </div>
      <h2>Give an order</h2>
      <div class="btns">
        <button class="btn unit-btn" type="button" id="moveBtn">Move a unit</button>
        <button class="btn unit-btn" type="button" id="attackBtn">Attack</button>
        <button class="btn btn--primary" type="button" id="endTurnBtn">End turn</button>
      </div>
      <div class="plate"><h2>Unit strengths</h2>
        <div class="row"><span>Soldier</span><span>3 health, 2 attack</span></div>
        <div class="row"><span>Tank</span><span>5 health, 4 attack</span></div>
        <div class="row"><span>Aircraft</span><span>2 health, 5 attack</span></div>
      </div>
    </aside>
  </div>
</main>

<template id="howto">
<ul>
  <li>Two players share the screen. Blue deploys in the bottom three rows, Red in the top three.</li>
  <li>Choose a unit, then select a square in your zone to deploy it. Units cost resources.</li>
  <li>To move or attack, choose the order, select your unit, then select the target square.</li>
  <li>Ending your turn earns 20 resources and hands over to the other player.</li>
</ul>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="war.js"></script>
</body>
</html>
