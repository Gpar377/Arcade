<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Deletion Game | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
<style>
.status-overlay { justify-self: stretch; margin-bottom: 10px; padding: 9px 14px; border-radius: 8px; background: #1A2029; color: #D8DEE8; font-weight: 600; font-size: 15px; text-align: center; }
.status-overlay.win { background: var(--good); color: #fff; }
.status-overlay.lose { background: var(--bad); color: #fff; }
.screen { align-content: start; }
</style>
</head>
<body data-game="deletion" data-pad="arrows h:Hint r:Restart">

<main class="console">
  <div class="lcd">
    <div class="read "><span class="read__label">Steps</span><span class="read__value" id="stepCount">0</span></div>
    <div class="read "><span class="read__label">Tiles deleted</span><span class="read__value" id="deletedCount">0</span></div>
    <div class="read "><span class="read__label">Distance to exit</span><span class="read__value" id="distanceToExit">--</span></div>
    <div class="read lcd__push"><span class="read__label">Survival rate</span><span class="read__value" id="survivalRate">100%</span></div>
  </div>
  <div class="deck">
    <div class="screen">
      <div class="status-overlay" id="statusOverlay" role="status">Navigate carefully. There is no going back.</div>
      <canvas id="gameCanvas" width="800" height="600" aria-label="Deletion Game board"></canvas>
    </div>
    <aside class="panel">
      <div class="btns">
        <button class="btn btn--primary" type="button" id="newGame">New game</button>
        <button class="btn" type="button" id="undoMove">Undo last move</button>
        <button class="btn" type="button" id="hintBtn">Show a hint</button>
      </div>
      <div class="plate"><h2>The one rule</h2><p>Every step permanently deletes the tile you just left. Reach the green exit before you cut off your own route.</p></div>
    </aside>
  </div>
  <div class="legend">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows to move</span>
    <span><kbd>H</kbd> hint</span>
    <span><kbd>R</kbd> restart level</span>
  </div>
</main>

<template id="howto">
<ul>
  <li>You are the red tile. The exit is the green one.</li>
  <li>Each time you move, the tile you left is deleted for good. You cannot walk back over it.</li>
  <li>Black tiles are obstacles. Walking into one ends the attempt.</li>
  <li>Plan the whole route first. Undo takes back one move, and a hint shows a safe direction.</li>
</ul>
<p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows move &nbsp; <kbd>H</kbd> hint &nbsp; <kbd>R</kbd> restart</p>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="game.js"></script>
</body>
</html>
