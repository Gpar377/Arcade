<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Invaders | Legendary Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/arcade.css">
</head>
<body data-game="invaders" data-pad="lr space:Fire p:Pause">

<main class="console console--mid">
  <div class="lcd">
    <div class="read "><span class="read__label">Score</span><span class="read__value" id="score">0</span></div>
    <div class="read "><span class="read__label">Lives</span><span class="read__value" id="lives">3</span></div>
    <div class="read "><span class="read__label">Wave</span><span class="read__value" id="wave">1</span></div>
  </div>
  <div class="screen">
    <canvas id="gameCanvas" width="800" height="600" aria-label="Space Invaders playfield"></canvas>
    <div class="overlay" id="gameOver">
      <div class="overlay__in">
        <h2>Game over</h2>
        <p>Score <span id="finalScore">0</span> &nbsp; Reached wave <span id="finalWave">1</span></p>
        <div class="btns"><button class="btn" type="button" onclick="game.restart()">Play again</button></div>
      </div>
    </div>
  </div>
  <div class="legend">
    <span><kbd>A</kbd><kbd>D</kbd> or <kbd>&larr;</kbd><kbd>&rarr;</kbd> move</span>
    <span><kbd>Space</kbd> fire</span>
    <span><kbd>P</kbd> pause</span>
    <span><kbd>R</kbd> restart</span>
  </div>
</main>

<template id="howto">
<ul>
  <li>Slide left and right along the bottom and shoot the aliens before they reach you.</li>
  <li>Clear the screen to start the next wave. Each wave is faster.</li>
  <li>You have three lives.</li>
</ul>
<p><kbd>A</kbd><kbd>D</kbd> or arrows move &nbsp; <kbd>Space</kbd> fire &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>R</kbd> restart</p>
</template>

<script src="../assets/games.js"></script>
<script src="../assets/arcade.js"></script>
<script src="invaders.js"></script>
</body>
</html>
